 <!-- Lightbox con navegación -->
<div id="lightbox" class="lightbox">
  <span class="cerrar">&times;</span>
  <img class="lightbox-img" src="" alt="Imagen ampliada">
</div>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.querySelector('.lightbox-img');
  const cerrar = document.querySelector('.cerrar');
  const imagenes = document.querySelectorAll('.photo img');

  let indiceActual = 0;

  function mostrarImagen(index) {
    if (index < 0) index = imagenes.length - 1;
    if (index >= imagenes.length) index = 0;
    indiceActual = index;
    lightboxImg.src = imagenes[indiceActual].src;
    lightboxImg.alt = imagenes[indiceActual].alt;
  }

  imagenes.forEach((img, index) => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      mostrarImagen(index);
    });
  });

  cerrar.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.style.display = 'none';
    } else if (e.clientX < window.innerWidth / 2) {
      mostrarImagen(indiceActual - 1);
    } else if (e.clientX > window.innerWidth / 2) {
      mostrarImagen(indiceActual + 1);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (lightbox.style.display === 'flex') {
      if (e.key === 'ArrowLeft') {
        mostrarImagen(indiceActual - 1);
      } else if (e.key === 'ArrowRight') {
        mostrarImagen(indiceActual + 1);
      } else if (e.key === 'Escape') {
        lightbox.style.display = 'none';
      }
    }
  });

  // --- Swipe para mobile ---
  let startX = 0;
  lightbox.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
  });

  lightbox.addEventListener('touchend', (e) => {
    let endX = e.changedTouches[0].clientX;
    let diffX = startX - endX;

    if (Math.abs(diffX) > 50) { // Sensibilidad swipe
      if (diffX > 0) {
        mostrarImagen(indiceActual + 1); // Swipe izquierda → siguiente
      } else {
        mostrarImagen(indiceActual - 1); // Swipe derecha → anterior
      }
    }
  });
</script>
